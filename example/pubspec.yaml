name: example
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev 

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
      sdk: flutter

  quran_library:
    path: ../
  # device_preview: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/quran_library_logo.png

# لا حاجة لِـ dependency_overrides: المكتبة نفسها تثبّت sherpa_onnx
# وحزمendorsers الأصلية كتبعيات مباشرة متطابقة (1.13.8) — والقيود
# المباشرة تنتقل إلى أي تطبيق مستهلك عبر حلّ الإصدارات.
# No overrides needed: the library pins sherpa_onnx + native endorsers
# as matching direct deps, and those constraints propagate to hosts.

