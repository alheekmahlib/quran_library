name: example
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev 

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
      sdk: flutter

  quran_library:
    path: ../
  # device_preview: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/quran_library_logo.png

dependency_overrides:
  # توحيد الأصول الأصلية مع طبقة Dart لـ sherpa_onnx (نفس تثبيت quran_audio) —
  # منع اختلاط أصول 1.13.x مع الطبقة المقيدة بـ <1.13.0.
  # Align sherpa_onnx native endorsers with the pinned Dart layer.
  sherpa_onnx_ios: 1.12.40
  sherpa_onnx_macos: 1.12.40
  sherpa_onnx_android_arm64: 1.12.40
  sherpa_onnx_android_armeabi: 1.12.40
  sherpa_onnx_android_x86: 1.12.40
  sherpa_onnx_android_x86_64: 1.12.40

